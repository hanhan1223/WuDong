# 乌东文旅 CI/CD Pipeline
# 触发条件：push 到 main/develop 或 PR 到 main

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"

jobs:
  # ===== Node.js 后端检查 =====
  server-lock-check:
    name: Server (Node) - Lock File Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify package-lock.json is in sync
        run: |
          npm install --package-lock-only
          git diff --exit-code package-lock.json || (echo "❌ package-lock.json is out of sync with package.json. Run 'npm install' locally and commit the lock file." && exit 1)

  server-lint:
    name: Server (Node) - Lint
    runs-on: ubuntu-latest
    needs: server-lock-check
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint

  server-test:
    name: Server (Node) - Test
    runs-on: ubuntu-latest
    needs: server-lint
    defaults:
      run:
        working-directory: ./server
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123456
          MYSQL_DATABASE: wudong_tourism_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
        env:
          DATABASE_URL: mysql://root:test123456@localhost:3306/wudong_tourism_test

  server-build:
    name: Server (Node) - Build
    runs-on: ubuntu-latest
    needs: [server-lint, server-test]
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build

  # ===== Java 后端检查 =====
  server-java-build:
    name: Server (Java) - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "maven"
      - run: mvn compile -B

  server-java-test:
    name: Server (Java) - Test
    runs-on: ubuntu-latest
    needs: server-java-build
    defaults:
      run:
        working-directory: ./server-java
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123456
          MYSQL_DATABASE: wudong
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "maven"
      - run: mvn test -B
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: wudong
          DB_USER: root
          DB_PASSWORD: test123456
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256

  # ===== 前端检查 =====
  admin-lint:
    name: Admin - Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  admin-build:
    name: Admin - Build
    runs-on: ubuntu-latest
    needs: [admin-lint]
    defaults:
      run:
        working-directory: ./admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build

  pc-lint:
    name: PC - Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: pc/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit --skipLibCheck

  pc-build:
    name: PC - Build
    runs-on: ubuntu-latest
    needs: [pc-lint]
    defaults:
      run:
        working-directory: ./pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: pc/package-lock.json
      - run: npm ci
      - run: npm run build

  # ===== Docker 构建（仅 main 分支）=====
  docker-build:
    name: Docker - Build
    runs-on: ubuntu-latest
    needs: [server-build, server-java-build, admin-build, pc-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: wudong-server:latest
      - uses: docker/build-push-action@v5
        with:
          context: ./server-java
          push: false
          tags: wudong-server-java:latest
      - uses: docker/build-push-action@v5
        with:
          context: ./admin
          push: false
          tags: wudong-admin:latest
      - uses: docker/build-push-action@v5
        with:
          context: ./pc
          push: false
          tags: wudong-pc:latest
