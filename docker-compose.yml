version: "3.8"

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: wudong-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: wudong_tourism
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --transaction-isolation=READ-COMMITTED
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: wudong-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 后端 API 服务
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wudong-server
    restart: always
    ports:
      - "7001:7001"
    environment:
      NODE_ENV: production
      MIDWAY_SERVER_PORT: 7001
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-root123456}@mysql:3306/wudong_tourism?charset=utf8mb4
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 管理后台 (React Admin)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: wudong-admin
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - server

  # PC端前端
  pc:
    build:
      context: ./pc
      dockerfile: Dockerfile
    container_name: wudong-pc
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: wudong-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - server
      - admin
      - pc

volumes:
  mysql-data:
  redis-data:
