services:
  # 后端 API 服务
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wudong-server
    restart: always
    ports:
      - "7001:7001"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:7001/swagger-ui/index.html",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 管理后台 (React Admin)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: wudong-admin
    restart: always
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy

  # PC端前端
  pc:
    build:
      context: ./pc
      dockerfile: Dockerfile
    container_name: wudong-pc
    restart: always
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: wudong-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - server
      - admin
      - pc
